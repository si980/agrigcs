<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_43 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_43" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_43');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Interactive 3D Field Model with Orbit Controls for AgriGCS
// Container and THREE are globally available in the runtime environment.
(function() {
  const width = container.clientWidth || window.innerWidth || 800;
  const height = container.clientHeight || window.innerHeight || 500;

  // Scene setup
  const scene = new THREE.Scene();

  // Perspective Camera
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.set(0, 26, 34);

  // WebGL Renderer with transparency
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x0f232d, 2.5);
  scene.add(ambientLight);

  const keyLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
  keyLight.position.set(20, 40, 20);
  keyLight.castShadow = true;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x00d2aa, 1.8);
  fillLight.position.set(-20, 25, -15);
  scene.add(fillLight);

  const warnPoint = new THREE.PointLight(0xf59e0b, 2.5, 20);
  warnPoint.position.set(4, 3, 2);
  scene.add(warnPoint);

  // Root interactive group
  const fieldGroup = new THREE.Group();
  scene.add(fieldGroup);

  // Base Pedestal / Soil Horizon Bed
  // Dark substrate block
  const bedGeo = new THREE.BoxGeometry(26, 2.2, 18);
  const bedMat = new THREE.MeshPhongMaterial({
    color: 0x0a1219,
    emissive: 0x050c10,
    shininess: 20
  });
  const bed = new THREE.Mesh(bedGeo, bedMat);
  bed.position.y = -1.1;
  bed.receiveShadow = true;
  fieldGroup.add(bed);

  // Outer Glowing Bezel / Tray Rim
  const rimGeo = new THREE.BoxGeometry(26.6, 0.4, 18.6);
  const rimMat = new THREE.MeshPhongMaterial({
    color: 0x15222e,
    emissive: 0x00d2aa,
    emissiveIntensity: 0.18,
    shininess: 40
  });
  const rim = new THREE.Mesh(rimGeo, rimMat);
  rim.position.y = 0.1;
  fieldGroup.add(rim);

  // Zone Field Plots (Cultivated beds with furrows and crops)
  // Zone A (Corn / Lush green - Left plot)
  const zoneAGeo = new THREE.BoxGeometry(11.5, 0.6, 15.5);
  const zoneAMat = new THREE.MeshPhongMaterial({
    color: 0x0f261f,
    emissive: 0x041a14,
    shininess: 15
  });
  const zoneA = new THREE.Mesh(zoneAGeo, zoneAMat);
  zoneA.position.set(-6.2, 0.3, 0);
  fieldGroup.add(zoneA);

  // Zone B (Kale / Alert Zone - Top Right plot)
  const zoneBGeo = new THREE.BoxGeometry(11.5, 0.6, 7.2);
  const zoneBMat = new THREE.MeshPhongMaterial({
    color: 0x241d15, // Drier soil tint
    emissive: 0x1f1406,
    shininess: 10
  });
  const zoneB = new THREE.Mesh(zoneBGeo, zoneBMat);
  zoneB.position.set(6.2, 0.3, -4.15);
  fieldGroup.add(zoneB);

  // Zone C (Soybeans / Right bottom plot)
  const zoneCGeo = new THREE.BoxGeometry(11.5, 0.6, 7.2);
  const zoneCMat = new THREE.MeshPhongMaterial({
    color: 0x10212b,
    emissive: 0x07151e,
    shininess: 15
  });
  const zoneC = new THREE.Mesh(zoneCGeo, zoneCMat);
  zoneC.position.set(6.2, 0.3, 4.15);
  fieldGroup.add(zoneC);

  // Zone boundary lines (Grid outlines)
  function createZoneBorder(w, d, colorHex, posY) {
    const hw = w / 2;
    const hd = d / 2;
    const pts = [
      new THREE.Vector3(-hw, posY, -hd),
      new THREE.Vector3(hw, posY, -hd),
      new THREE.Vector3(hw, posY, hd),
      new THREE.Vector3(-hw, posY, hd),
      new THREE.Vector3(-hw, posY, -hd)
    ];
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    const lineMat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2 });
    return new THREE.Line(lineGeo, lineMat);
  }

  const borderA = createZoneBorder(11.5, 15.5, 0x00d2aa, 0.65);
  borderA.position.set(-6.2, 0, 0);
  fieldGroup.add(borderA);

  const borderB = createZoneBorder(11.5, 7.2, 0xf59e0b, 0.65); // Amber alert border
  borderB.position.set(6.2, 0, -4.15);
  fieldGroup.add(borderB);

  const borderC = createZoneBorder(11.5, 7.2, 0x38bdf8, 0.65);
  borderC.position.set(6.2, 0, 4.15);
  fieldGroup.add(borderC);

  // Field Furrows & Crop Canopies
  const cropGroup = new THREE.Group();
  fieldGroup.add(cropGroup);

  const plantGeo = new THREE.ConeGeometry(0.28, 0.65, 5);
  const plantMatA = new THREE.MeshLambertMaterial({ color: 0x00d2aa });
  const plantMatB = new THREE.MeshLambertMaterial({ color: 0xb45309 }); // Stressed foliage
  const plantMatC = new THREE.MeshLambertMaterial({ color: 0x10b981 });

  // Rows for Zone A
  for (let r = -6.5; r <= 6.5; r += 1.3) {
    for (let c = -10.5; c <= -1.8; c += 1.1) {
      const plant = new THREE.Mesh(plantGeo, plantMatA);
      plant.position.set(c + (Math.random() - 0.5) * 0.15, 0.9, r);
      plant.rotation.y = Math.random() * Math.PI;
      cropGroup.add(plant);
    }
  }

  // Rows for Zone B (Sparse / Stressed)
  for (let r = -6.5; r <= -1.8; r += 1.2) {
    for (let c = 2.0; c <= 10.5; c += 1.2) {
      const plant = new THREE.Mesh(plantGeo, plantMatB);
      plant.position.set(c, 0.85, r);
      plant.scale.set(0.75, 0.75, 0.75);
      cropGroup.add(plant);
    }
  }

  // Rows for Zone C
  for (let r = 1.8; r <= 6.5; r += 1.2) {
    for (let c = 2.0; c <= 10.5; c += 1.2) {
      const plant = new THREE.Mesh(plantGeo, plantMatC);
      plant.position.set(c, 0.9, r);
      cropGroup.add(plant);
    }
  }

  // IoT Hardware Models in 3D
  // 1. Central Solar Mesh Gateway #1 (at Zone intersection)
  const gatewayGroup = new THREE.Group();
  gatewayGroup.position.set(0, 0.6, 0);
  fieldGroup.add(gatewayGroup);

  // Gateway mast
  const mastGeo = new THREE.CylinderGeometry(0.1, 0.1, 3.2, 8);
  const metalMat = new THREE.MeshPhongMaterial({ color: 0x94a3b8, shininess: 80 });
  const mast = new THREE.Mesh(mastGeo, metalMat);
  mast.position.y = 1.6;
  gatewayGroup.add(mast);

  // Solar panel on mast
  const panelGeo = new THREE.BoxGeometry(1.6, 0.08, 1.2);
  const panelMat = new THREE.MeshPhongMaterial({ color: 0x1e3a8a, emissive: 0x0e2a5e, shininess: 90 });
  const panel = new THREE.Mesh(panelGeo, panelMat);
  panel.position.set(0, 3.0, -0.2);
  panel.rotation.x = -Math.PI / 4;
  gatewayGroup.add(panel);

  // Gateway weather enclosure
  const encGeo = new THREE.BoxGeometry(0.7, 0.9, 0.5);
  const encMat = new THREE.MeshPhongMaterial({ color: 0xe2e8f0, emissive: 0x00d2aa, emissiveIntensity: 0.1 });
  const enc = new THREE.Mesh(encGeo, encMat);
  enc.position.set(0, 1.8, 0);
  gatewayGroup.add(enc);

  // Glowing antenna beacon tip
  const beaconTipGeo = new THREE.SphereGeometry(0.18, 12, 12);
  const beaconTipMat = new THREE.MeshBasicMaterial({ color: 0x00d2aa });
  const beaconTip = new THREE.Mesh(beaconTipGeo, beaconTipMat);
  beaconTip.position.set(0, 3.4, 0);
  gatewayGroup.add(beaconTip);

  // 2. Sensor Probe Node B1 (Alert node in Zone B)
  const probeBGroup = new THREE.Group();
  probeBGroup.position.set(6.2, 0.6, -4.15);
  fieldGroup.add(probeBGroup);

  const probeGeo = new THREE.BoxGeometry(0.5, 0.8, 0.35);
  const probeMat = new THREE.MeshPhongMaterial({ color: 0x0284c7 });
  const probeMesh = new THREE.Mesh(probeGeo, probeMat);
  probeMesh.position.y = 0.5;
  probeBGroup.add(probeMesh);

  // Warning beacon tip for Node B1
  const warnTipGeo = new THREE.SphereGeometry(0.16, 10, 10);
  const warnTipMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
  const warnTip = new THREE.Mesh(warnTipGeo, warnTipMat);
  warnTip.position.y = 1.1;
  probeBGroup.add(warnTip);

  // 3. Sensor Probe Node A1 (Nominal node in Zone A)
  const probeAGroup = new THREE.Group();
  probeAGroup.position.set(-6.2, 0.6, 2.0);
  fieldGroup.add(probeAGroup);

  const probeAMesh = new THREE.Mesh(probeGeo, probeMat);
  probeAMesh.position.y = 0.5;
  probeAGroup.add(probeAMesh);

  const normTipGeo = new THREE.SphereGeometry(0.16, 10, 10);
  const normTipMat = new THREE.MeshBasicMaterial({ color: 0x00d2aa });
  const normTip = new THREE.Mesh(normTipGeo, normTipMat);
  normTip.position.y = 1.1;
  probeAGroup.add(normTip);

  // Animated Mesh RF Link lines
  const rfLineMat = new THREE.LineDashedMaterial({
    color: 0x38bdf8,
    dashSize: 0.5,
    gapSize: 0.3,
    linewidth: 2
  });

  const rfPtsA = [
    new THREE.Vector3(0, 3.4, 0),
    new THREE.Vector3(-6.2, 1.7, 2.0)
  ];
  const rfGeoA = new THREE.BufferGeometry().setFromPoints(rfPtsA);
  const rfLineA = new THREE.Line(rfGeoA, rfLineMat);
  rfLineA.computeLineDistances();
  fieldGroup.add(rfLineA);

  const rfPtsB = [
    new THREE.Vector3(0, 3.4, 0),
    new THREE.Vector3(6.2, 1.7, -4.15)
  ];
  const rfGeoB = new THREE.BufferGeometry().setFromPoints(rfPtsB);
  const rfLineB = new THREE.Line(rfGeoB, rfLineMat);
  rfLineB.computeLineDistances();
  fieldGroup.add(rfLineB);

  // Luminous pulsing wave rings for the nodes
  const ringGeo = new THREE.RingGeometry(0.2, 0.35, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x00d2aa,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.8
  });
  const pulseRing = new THREE.Mesh(ringGeo, ringMat);
  pulseRing.rotation.x = -Math.PI / 2;
  pulseRing.position.set(0, 0.65, 0);
  fieldGroup.add(pulseRing);

  // Orthogonal ground matrix grid
  const gridHelper = new THREE.GridHelper(26, 26, 0x00d2aa, 0x152532);
  gridHelper.position.y = 0.62;
  fieldGroup.add(gridHelper);

  // -------------------------------------------------------------
  // Built-in Camera Orbit & Pan Controls (Mouse & Touch drag)
  // -------------------------------------------------------------
  let isDragging = false;
  let prevMousePos = { x: 0, y: 0 };
  let spherical = {
    radius: 42,
    theta: THREE.MathUtils.degToRad(35), // Azimuthal angle around Y
    phi: THREE.MathUtils.degToRad(50)    // Polar angle from +Y
  };
  let targetLookAt = new THREE.Vector3(0, 1, 0);
  let dampingFactor = 0.08;
  let targetRotation = { theta: spherical.theta, phi: spherical.phi, radius: spherical.radius };

  function updateCameraPosition() {
    spherical.theta += (targetRotation.theta - spherical.theta) * dampingFactor;
    spherical.phi += (targetRotation.phi - spherical.phi) * dampingFactor;
    spherical.radius += (targetRotation.radius - spherical.radius) * dampingFactor;

    // Constrain polar angle so user doesn't flip underneath the terrain
    spherical.phi = Math.max(0.15, Math.min(Math.PI / 2 - 0.05, spherical.phi));
    spherical.radius = Math.max(12, Math.min(80, spherical.radius));

    camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
    camera.position.y = spherical.radius * Math.cos(spherical.phi);
    camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
    camera.lookAt(targetLookAt);
  }

  // Pointer event listeners on canvas container
  const domElem = renderer.domElement;
  domElem.style.cursor = 'grab';

  domElem.addEventListener('mousedown', (e) => {
    isDragging = true;
    domElem.style.cursor = 'grabbing';
    prevMousePos.x = e.clientX;
    prevMousePos.y = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - prevMousePos.x;
    const dy = e.clientY - prevMousePos.y;

    targetRotation.theta -= dx * 0.007;
    targetRotation.phi -= dy * 0.006;

    prevMousePos.x = e.clientX;
    prevMousePos.y = e.clientY;
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    domElem.style.cursor = 'grab';
  });

  // Mouse wheel zoom
  domElem.addEventListener('wheel', (e) => {
    e.preventDefault();
    targetRotation.radius += e.deltaY * 0.04;
  }, { passive: false });

  // Touch controls for mobile/touchpads
  domElem.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      prevMousePos.x = e.touches[0].clientX;
      prevMousePos.y = e.touches[0].clientY;
    }
  });

  window.addEventListener('touchmove', (e) => {
    if (!isDragging || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - prevMousePos.x;
    const dy = e.touches[0].clientY - prevMousePos.y;

    targetRotation.theta -= dx * 0.009;
    targetRotation.phi -= dy * 0.008;

    prevMousePos.x = e.touches[0].clientX;
    prevMousePos.y = e.touches[0].clientY;
  });

  window.addEventListener('touchend', () => {
    isDragging = false;
  });

  // Resize Handling
  function onWindowResize() {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onWindowResize);

  // Render Loop
  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    // Subtle ambient rotation when user is not actively dragging
    if (!isDragging) {
      targetRotation.theta += 0.001;
    }

    // Pulse effects on hardware beacons
    const pulse = 0.5 + 0.5 * Math.sin(elapsedTime * 4.0);
    beaconTipMat.color.setHex(pulse > 0.5 ? 0x00d2aa : 0x14b8a6);
    warnTipMat.color.setHex(pulse > 0.5 ? 0xf59e0b : 0xef4444);

    // Expand concentric wireless pulse ring
    const ringScale = 1.0 + (elapsedTime % 2.5) * 4.0;
    pulseRing.scale.set(ringScale, ringScale, 1);
    pulseRing.material.opacity = Math.max(0, 1.0 - (ringScale / 11.0));

    // Update camera smoothing
    updateCameraPosition();

    renderer.render(scene, camera);
  }
  animate();

  // Expose global hook for resetting orbit if needed
  window.__agriGcsResetCamera = function() {
    targetRotation.theta = THREE.MathUtils.degToRad(35);
    targetRotation.phi = THREE.MathUtils.degToRad(50);
    targetRotation.radius = 42;
  };
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_43 -->


<script src="../agrigcs-nav.js"></script></body></html>
